<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interactive 3D Room - Spacious Layout</title>
  <link rel="stylesheet" href="style.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

<div id="loading">Loading 3D Models...</div>
<div id="blink-overlay"></div>
<div id="instructions">W/A/S/D to Walk | Walk to the Table or Boards to investigate</div>

<div id="joystick-zone">
  <div id="joystick-stick"></div>
</div>
<div id="cutscene-table" class="cutscene-screen" title="Click to close table blueprint">
    <img id="newspaper-overlay" src="image_90cdb7.png" alt="News Article">
</div>
<div id="cutscene-board" class="cutscene-screen" title="Click to close board evidence"></div>
<div id="cutscene-window" class="cutscene-screen" title="Click to step back from window">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: monospace; font-size: 24px; text-align: center; letter-spacing: 2px;">
        You gaze out into the endless morning...<br><br>
        <span style="font-size: 14px; opacity: 0.5;">(Click to step back)</span>
    </div>
</div>
<div id="cutscene-cabinet" class="cutscene-screen" title="Click to step back from cabinet">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: monospace; font-size: 24px; text-align: center; letter-spacing: 2px;">
        You rummage through the dusty files...<br><br>
        <span style="font-size: 14px; opacity: 0.5;">(Click to step back)</span>
    </div>
</div>

<video id="windowVideo" preload="auto" loop muted autoplay crossOrigin="anonymous" playsinline style="display: none;">
  <source src="8623-212638552.mp4" type="video/mp4">
</video>
<video id="windowVideoRoom" preload="auto" loop muted autoplay crossOrigin="anonymous" playsinline style="display: none;">
  <source src="12254166_3840_2160_60fps.mp4" type="video/mp4">
</video>

<script type="module" src="main.js"></script>
</body>
</html>
